syntax = "proto3";

package orders.v1;

option go_package = "github.com/smkrep/devsecops-2026-coursework/gen/orders/v1;ordersv1";

import "google/api/annotations.proto";

service OrderService {
  rpc GetOrder(GetOrderRequest) returns (Order) {
    option (google.api.http) = {
      get: "/api/v1/orders/{id}"
    };
  }
}

message GetOrderRequest {
  string id = 1;
}

message Order {
  string id = 1;
  string item_id = 2;
  string status = 3;
}
